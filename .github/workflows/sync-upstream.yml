# .github/workflows/sync-upstream.yml
name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/Rosemoe/sora-editor.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          UPSTREAM_REV=$(git rev-parse upstream/main)
          HEAD_REV=$(git rev-parse HEAD)

          if [ "$UPSTREAM_REV" = "$HEAD_REV" ]; then
            echo "Already up to date."
            echo "CHANGES=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fast-forward possible."
            git merge upstream/main --ff-only
            echo "CHANGES=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$(git merge-base upstream/main HEAD)" = "$UPSTREAM_REV" ]; then
            echo "Upstream already merged, nothing to sync."
            echo "CHANGES=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "History diverged, attempting merge..."
          git merge upstream/main --no-commit --no-ff || true

          conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)

          if [ -n "$conflicts" ]; then
            echo "Conflicts in:"
            echo "$conflicts"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                README*|LICENSE)
                  echo "Auto-resolving (ours): $file"
                  git checkout --ours "$file"
                  git add "$file"
                  ;;
              esac
            done <<< "$conflicts"

            remaining=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -n "$remaining" ]; then
              echo "::error::Code conflicts require manual resolution: $remaining"
              git merge --abort
              exit 1
            fi
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "CHANGES=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: sync from upstream/main"
          echo "CHANGES=true" >> $GITHUB_OUTPUT

      - name: Push changes
        if: steps.merge.outputs.CHANGES == 'true'
        run: |
          git push origin main
